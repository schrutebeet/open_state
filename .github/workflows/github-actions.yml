name: Pulso País data update workflow

on:
  # Runs on the 15th of every month at 04:17 in mainland Spain.
  # Europe/Madrid automatically follows CET/CEST daylight-saving changes.
  schedule:
    - cron: "17 4 15 * *"
      timezone: "Europe/Madrid"

  # Also lets you launch and test the workflow manually from GitHub.
  workflow_dispatch:

# Prevent two executions from writing the SQLite database simultaneously.
concurrency:
  group: civic-metrics-production-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    name: Run ingestion and persist SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Madrid
      LOOKBACK_PERIOD: ${{ vars.LOOKBACK_PERIOD || 12 }}
      SAVE_FILES_LOCALLY: "false"
      RUNTIME_DIR: ${{ runner.temp }}/civic-metrics-runtime
      ARTIFACTS_DIR: ${{ runner.temp }}/civic-metrics-artifacts
      HISTORY_DB_PATH: ${{ runner.temp }}/civic-metrics-history.db
      SNAPSHOT_DB_PATH: ${{ runner.temp }}/civic-metrics-snapshot.db
      BUDGET_HISTORY_PATH: ${{ runner.temp }}/civic-metrics-budget_execution_history.json
      DATABASE_URL: sqlite+pysqlite:///${{ runner.temp }}/civic-metrics-history.db
      DASHBOARD_PATH: ${{ runner.temp }}/paisometro-dashboard.json
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_PRIVATE_BUCKET: paisometro-private
      R2_PUBLIC_BUCKET: paisometro-public
      DATACOMEX_USERNAME: ${{ secrets.DATACOMEX_USERNAME }}
      DATACOMEX_PASSWORD: ${{ secrets.DATACOMEX_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Check deployment configuration
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Missing secret R2_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Missing secret R2_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || { echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$R2_PRIVATE_BUCKET" || { echo "::error::Private bucket is not configured"; exit 1; }
          test -n "$R2_PUBLIC_BUCKET" || { echo "::error::Public bucket is not configured"; exit 1; }
          test -n "$DATACOMEX_USERNAME" || { echo "::error::Missing secret DATACOMEX_USERNAME"; exit 1; }
          test -n "$DATACOMEX_PASSWORD" || { echo "::error::Missing secret DATACOMEX_PASSWORD"; exit 1; }
          echo "Spain time: $(date --iso-8601=seconds)"
          aws --version

      - name: Prepare data directories
        run: mkdir -p "$RUNTIME_DIR" "$ARTIFACTS_DIR"

      - name: Restore latest database from R2
        run: |
          RESTORED_HISTORY_PATH="${HISTORY_DB_PATH}.restored"
          RESTORE_ERROR="$(mktemp)"
          rm -f "$RESTORED_HISTORY_PATH"
          if aws s3 cp \
            "s3://${R2_PRIVATE_BUCKET}/history.db" \
            "$RESTORED_HISTORY_PATH" \
            --endpoint-url "$R2_ENDPOINT_URL" 2>"$RESTORE_ERROR"; then
            python - "$RESTORED_HISTORY_PATH" <<'PY'
          import sqlite3
          import sys
          from pathlib import Path

          database = Path(sys.argv[1])
          with sqlite3.connect(database) as connection:
              result = connection.execute("PRAGMA quick_check").fetchone()
              observations = connection.execute(
                  "SELECT COUNT(*) FROM observations"
              ).fetchone()[0]
          if not result or result[0] != "ok":
              raise SystemExit(f"Restored history failed SQLite integrity check: {result}")
          print(f"Validated restored history: {observations} observations")
          PY
            mv -f "$RESTORED_HISTORY_PATH" "$HISTORY_DB_PATH"
            rm -f "$RESTORE_ERROR"
            echo "Restored and validated the complete historical database from R2."
          else
            if grep -Eqi 'NoSuchKey|Not Found|404|does not exist' "$RESTORE_ERROR"; then
              echo "No historical database exists in R2; starting a new history database."
              rm -f "$HISTORY_DB_PATH" "$HISTORY_DB_PATH-wal" "$HISTORY_DB_PATH-shm"
              rm -f "$RESTORED_HISTORY_PATH" "$RESTORE_ERROR"
            else
              echo "::error::Could not restore history.db from R2; refusing to replace history."
              cat "$RESTORE_ERROR" >&2
              rm -f "$RESTORED_HISTORY_PATH" "$RESTORE_ERROR"
              exit 1
            fi
          fi

      - name: Verify restored database history
        run: |
          python - <<'PY'
          import os
          import sqlite3

          database = os.environ["HISTORY_DB_PATH"]
          if not os.path.isfile(database):
            observations = 0
            indicators = 0
          else:
            with sqlite3.connect(database) as connection:
              observations = connection.execute(
                "SELECT COUNT(*) FROM observations"
              ).fetchone()[0]
              indicators = connection.execute(
                "SELECT COUNT(*) FROM indicators"
              ).fetchone()[0]

          print(f"Restored history: {observations} observations, {indicators} indicators")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"RESTORED_OBSERVATIONS={observations}\n")

      - name: Restore IGAE budget history JSON from R2
        run: |
          RESTORED_BUDGET_PATH="${BUDGET_HISTORY_PATH}.restored"
          RESTORE_ERROR="$(mktemp)"
          rm -f "$RESTORED_BUDGET_PATH"
          if aws s3 cp \
            "s3://${R2_PUBLIC_BUCKET}/v1/budget_execution_history.json" \
            "$RESTORED_BUDGET_PATH" \
            --endpoint-url "$R2_ENDPOINT_URL" 2>"$RESTORE_ERROR"; then
            python - "$RESTORED_BUDGET_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          periods = payload.get("periods", {})
          categories = sum(len(item.get("categories", [])) for item in periods.values())
          if not periods or not categories:
              raise SystemExit("Restored budget JSON contains no periods or categories")
          print(f"Validated restored budget history: {len(periods)} periods, {categories} categories")
          PY
            mv -f "$RESTORED_BUDGET_PATH" "$BUDGET_HISTORY_PATH"
            rm -f "$RESTORE_ERROR"
            echo "Restored and validated budget_execution_history.json from public R2."
          else
            if grep -Eqi 'NoSuchKey|Not Found|404|does not exist' "$RESTORE_ERROR"; then
              echo "No budget history JSON exists in R2; copying the repository seed file to runner temp."
              test -s "data/budget_execution_history.json" || {
                echo "::error::No R2 budget JSON and no repository seed file found" >&2
                rm -f "$RESTORED_BUDGET_PATH" "$RESTORE_ERROR"
                exit 1
              }
              cp "data/budget_execution_history.json" "$BUDGET_HISTORY_PATH"
              rm -f "$RESTORED_BUDGET_PATH" "$RESTORE_ERROR"
            else
              echo "::error::Could not restore budget_execution_history.json from R2; refusing to replace it."
              cat "$RESTORE_ERROR" >&2
              rm -f "$RESTORED_BUDGET_PATH" "$RESTORE_ERROR"
              exit 1
            fi
          fi

      - name: Run backend
        # Strict mode returns a non-zero exit code if any required dataset
        # fails, is incomplete or is skipped, preventing publication to R2.
        run: python main.py --strict

      - name: Verify execution snapshot
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          database = Path(os.environ["SNAPSHOT_DB_PATH"])
          if not database.is_file() or database.stat().st_size == 0:
            raise SystemExit(f"Snapshot database was not created: {database}")

          with sqlite3.connect(database) as connection:
            maximum = connection.execute(
              """
              SELECT MAX(period_count) FROM (
                SELECT indicator_id, COUNT(DISTINCT period_start || ':' || period_end) AS period_count
                FROM observations
                WHERE status = 'published'
                GROUP BY indicator_id
              )
              """
            ).fetchone()[0] or 0
          if maximum > int(os.environ["LOOKBACK_PERIOD"]):
            raise SystemExit(
              f"Snapshot exceeds LOOKBACK_PERIOD: {maximum} > {os.environ['LOOKBACK_PERIOD']}"
            )
          print(f"Snapshot respects LOOKBACK_PERIOD={os.environ['LOOKBACK_PERIOD']}")

      - name: Verify IGAE budget history JSON
        run: |
          test -s "$BUDGET_HISTORY_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["BUDGET_HISTORY_PATH"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          periods = payload.get("periods", {})
          categories = sum(len(item.get("categories", [])) for item in periods.values())
          if not periods or not categories:
              raise SystemExit("IGAE budget history JSON contains no periods or categories")
          print(f"Validated IGAE budget history JSON: {len(periods)} periods, {categories} categories")
          PY

      - name: Verify and checkpoint private SQLite databases
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          databases = {
              "history": Path(os.environ["HISTORY_DB_PATH"]),
              "snapshot": Path(os.environ["SNAPSHOT_DB_PATH"]),
          }
          for name, database in databases.items():
              if not database.is_file() or database.stat().st_size == 0:
                  raise SystemExit(f"{name.title()} database was not created: {database}")

              with sqlite3.connect(database) as connection:
                  connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
                  result = connection.execute("PRAGMA quick_check").fetchone()
                  observations = connection.execute(
                    "SELECT COUNT(*) FROM observations"
                  ).fetchone()[0]

              if not result or result[0] != "ok":
                  raise SystemExit(
                      f"SQLite integrity check failed for {name}: {result}"
                  )
              if name == "history" and observations < int(
                  os.environ["RESTORED_OBSERVATIONS"]
              ):
                  raise SystemExit(
                      "SQLite observation count decreased after ingestion: "
                      f"{observations} < {os.environ['RESTORED_OBSERVATIONS']}"
                  )

              print(
                  f"{name.title()} SQLite integrity check passed "
                  f"({database.stat().st_size} bytes, {observations} observations)."
              )
          PY

      # Persist both databases before publishing anything derived from them.
      # The public JSON is deliberately the final publication step.
      - name: Upload dated snapshot backup to private R2
        run: |
          BACKUP_DATE="$(date +%Y-%m-%dT%H-%M-%S%z)"
          aws s3 cp \
            "$SNAPSHOT_DB_PATH" \
            "s3://${R2_PRIVATE_BUCKET}/backups/${BACKUP_DATE}/snapshot.db" \
            --endpoint-url "$R2_ENDPOINT_URL"

      - name: Publish current history database to private R2
        run: |
          aws s3 cp \
            "$HISTORY_DB_PATH" \
            "s3://${R2_PRIVATE_BUCKET}/history.db" \
            --endpoint-url "$R2_ENDPOINT_URL"

      - name: Publish IGAE budget history JSON to public R2 bucket
        run: |
          aws s3 cp \
            "$BUDGET_HISTORY_PATH" \
            "s3://${R2_PUBLIC_BUCKET}/v1/budget_execution_history.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=3600, stale-while-revalidate=86400"

      - name: Export frontend-safe JSON from the current snapshot
        run: |
          python scripts/export_dashboard.py \
            --database "$SNAPSHOT_DB_PATH" \
            --output "$DASHBOARD_PATH"
          test -s "$DASHBOARD_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dashboard = json.loads(
              Path(os.environ["DASHBOARD_PATH"]).read_text(encoding="utf-8")
          )
          if not dashboard.get("indicators"):
              raise SystemExit("Generated dashboard JSON contains no indicators")
          untranslated = [
              code
              for code, indicator in dashboard["indicators"].items()
              if (
                  not indicator.get("nameEs")
                  or not indicator.get("descriptionEs")
                  or not indicator.get("onboarding", {}).get("profiles")
                  or not indicator.get("onboarding", {}).get("relevantAreas")
                  or not indicator.get("onboarding", {}).get("objectives")
              )
          ]
          if untranslated:
              raise SystemExit(
                  "Generated dashboard JSON is missing Spanish text for: "
                  + ", ".join(untranslated)
              )
          print(
              "Generated dashboard JSON from the current snapshot: "
              f"{len(dashboard['indicators'])} indicators"
          )
          PY

      - name: Publish dashboard JSON to public R2 bucket
        run: |
          aws s3 cp \
            "$DASHBOARD_PATH" \
            "s3://${R2_PUBLIC_BUCKET}/v1/paisometro-dashboard.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300, stale-while-revalidate=86400"

      - name: Remove local data files from runner
        if: always() && env.SAVE_FILES_LOCALLY == 'false'
        run: |
          if [ -d data ]; then
            find data -mindepth 1 -maxdepth 1 -type f -print -delete
          fi

