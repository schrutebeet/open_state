name: Pulso País data update workflow

on:
  # Runs on the 15th of every month at 04:17 in mainland Spain.
  # Europe/Madrid automatically follows CET/CEST daylight-saving changes.
  schedule:
    - cron: "17 4 15 * *"
      timezone: "Europe/Madrid"

  # Also lets you launch and test the workflow manually from GitHub.
  workflow_dispatch:

# Prevent two executions from writing the SQLite database simultaneously.
concurrency:
  group: civic-metrics-production-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-data:
    name: Run ingestion and persist SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Madrid
      LOOKBACK_PERIOD: ${{ vars.LOOKBACK_PERIOD || 12 }}
      HISTORY_DB_PATH: data/history.db
      SNAPSHOT_DB_PATH: data/snapshot.db
      DATABASE_URL: sqlite+pysqlite:///${{ github.workspace }}/data/history.db
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
      R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
      DATACOMEX_USERNAME: ${{ secrets.DATACOMEX_USERNAME }}
      DATACOMEX_PASSWORD: ${{ secrets.DATACOMEX_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Check deployment configuration
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Missing secret R2_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Missing secret R2_SECRET_ACCESS_KEY"; exit 1; }
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || { echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$R2_PRIVATE_BUCKET" || { echo "::error::Missing repository variable R2_PRIVATE_BUCKET"; exit 1; }
          test -n "$R2_PUBLIC_BUCKET" || { echo "::error::Missing repository variable R2_PUBLIC_BUCKET"; exit 1; }
          test -n "$DATACOMEX_USERNAME" || { echo "::error::Missing secret DATACOMEX_USERNAME"; exit 1; }
          test -n "$DATACOMEX_PASSWORD" || { echo "::error::Missing secret DATACOMEX_PASSWORD"; exit 1; }
          echo "Spain time: $(date --iso-8601=seconds)"
          aws --version

      - name: Prepare data directories
        run: mkdir -p data artifacts

      - name: Restore latest database from R2
        run: |
          if aws s3 cp \
            "s3://${R2_PRIVATE_BUCKET}/current/history.db" \
            "$HISTORY_DB_PATH" \
            --endpoint-url "$R2_ENDPOINT_URL"; then
            echo "Restored the complete historical database from R2."
          else
            echo "No historical database exists in R2; starting a new history database."
            rm -f "$HISTORY_DB_PATH"
          fi

      - name: Verify restored database history
        run: |
          python - <<'PY'
          import os
          import sqlite3

          database = os.environ["HISTORY_DB_PATH"]
          if not os.path.isfile(database):
            observations = 0
            indicators = 0
          else:
            with sqlite3.connect(database) as connection:
              observations = connection.execute(
                "SELECT COUNT(*) FROM observations"
              ).fetchone()[0]
              indicators = connection.execute(
                "SELECT COUNT(*) FROM indicators"
              ).fetchone()[0]

          print(f"Restored history: {observations} observations, {indicators} indicators")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"RESTORED_OBSERVATIONS={observations}\n")

      - name: Run backend
        # Strict mode returns a non-zero exit code if any required dataset
        # fails, is incomplete or is skipped, preventing publication to R2.
        run: python main.py --strict

      - name: Verify execution snapshot
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          database = Path(os.environ["SNAPSHOT_DB_PATH"])
          if not database.is_file() or database.stat().st_size == 0:
            raise SystemExit(f"Snapshot database was not created: {database}")

          with sqlite3.connect(database) as connection:
            maximum = connection.execute(
              """
              SELECT MAX(period_count) FROM (
                SELECT indicator_id, COUNT(DISTINCT period_start || ':' || period_end) AS period_count
                FROM observations
                WHERE status = 'published'
                GROUP BY indicator_id
              )
              """
            ).fetchone()[0] or 0
          if maximum > int(os.environ["LOOKBACK_PERIOD"]):
            raise SystemExit(
              f"Snapshot exceeds LOOKBACK_PERIOD: {maximum} > {os.environ['LOOKBACK_PERIOD']}"
            )
          print(f"Snapshot respects LOOKBACK_PERIOD={os.environ['LOOKBACK_PERIOD']}")
          PY

      - name: Verify and checkpoint private SQLite databases
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          databases = {
              "history": Path(os.environ["HISTORY_DB_PATH"]),
              "snapshot": Path(os.environ["SNAPSHOT_DB_PATH"]),
          }
          for name, database in databases.items():
              if not database.is_file() or database.stat().st_size == 0:
                  raise SystemExit(f"{name.title()} database was not created: {database}")

              with sqlite3.connect(database) as connection:
                  connection.execute("PRAGMA wal_checkpoint(TRUNCATE)")
                  result = connection.execute("PRAGMA quick_check").fetchone()
                  observations = connection.execute(
                    "SELECT COUNT(*) FROM observations"
                  ).fetchone()[0]

              if not result or result[0] != "ok":
                  raise SystemExit(
                      f"SQLite integrity check failed for {name}: {result}"
                  )
              if name == "history" and observations < int(
                  os.environ["RESTORED_OBSERVATIONS"]
              ):
                  raise SystemExit(
                      "SQLite observation count decreased after ingestion: "
                      f"{observations} < {os.environ['RESTORED_OBSERVATIONS']}"
                  )

              print(
                  f"{name.title()} SQLite integrity check passed "
                  f"({database.stat().st_size} bytes, {observations} observations)."
              )
          PY

      # Persist both databases before publishing anything derived from them.
      # The public JSON is deliberately the final publication step.
      - name: Upload dated database backups to private R2
        run: |
          BACKUP_DATE="$(date +%Y-%m-%dT%H-%M-%S%z)"
          aws s3 cp \
            "$HISTORY_DB_PATH" \
            "s3://${R2_PRIVATE_BUCKET}/backups/${BACKUP_DATE}/history.db" \
            --endpoint-url "$R2_ENDPOINT_URL"
          aws s3 cp \
            "$SNAPSHOT_DB_PATH" \
            "s3://${R2_PRIVATE_BUCKET}/backups/${BACKUP_DATE}/snapshot.db" \
            --endpoint-url "$R2_ENDPOINT_URL"

      - name: Publish current databases to private R2
        run: |
          aws s3 cp \
            "$HISTORY_DB_PATH" \
            "s3://${R2_PRIVATE_BUCKET}/current/history.db" \
            --endpoint-url "$R2_ENDPOINT_URL"
          aws s3 cp \
            "$SNAPSHOT_DB_PATH" \
            "s3://${R2_PRIVATE_BUCKET}/current/civic_metrics_snapshot.db" \
            --endpoint-url "$R2_ENDPOINT_URL"

      - name: Export frontend-safe JSON from the current snapshot
        run: |
          rm -f public/dashboard.json
          python scripts/export_dashboard.py \
            --database "$SNAPSHOT_DB_PATH" \
            --output public/dashboard.json
          test -s public/dashboard.json
          python - <<'PY'
          import json
          from pathlib import Path

          dashboard = json.loads(Path("public/dashboard.json").read_text(encoding="utf-8"))
          if not dashboard.get("indicators"):
              raise SystemExit("Generated dashboard JSON contains no indicators")
          print(
              "Generated dashboard JSON from the current snapshot: "
              f"{len(dashboard['indicators'])} indicators"
          )
          PY

      - name: Publish dashboard JSON to public R2 bucket
        run: |
          aws s3 cp \
            public/dashboard.json \
            "s3://${R2_PUBLIC_BUCKET}/v1/dashboard.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=300, stale-while-revalidate=86400"

      # This copy is useful for debugging and can be downloaded from the
      # individual workflow run. It is not the persistent production copy.
      - name: Attach database to workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civic-metrics-${{ github.run_id }}
          path: |
            data/history.db
            data/history.db-wal
            data/history.db-shm
            data/snapshot.db
          if-no-files-found: warn
          retention-days: 30
