    - Pensiones por CCAA y provincias
    extensions:
    - .xlsx
    - .xls
    data_sheet: CA_Total sistema
    data_sheet_fallbacks:
    - CA2
    - TOTALSISTEMA.
    - TOTALSISTEMA
    - Total Sistema
