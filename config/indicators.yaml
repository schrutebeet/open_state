- code: nominal_wage_growth
  name: Nominal wage growth
  description: Year-on-year growth in employees' wages and salaries in Spain before consumer-price adjustment.
  category: employment
  subcategory: wages
  dataset: eurostat_labour_cost_index
  unit: percent
  frequency: quarterly
  extraction:
    kind: eurostat_jsonstat
    dimension_filters:
