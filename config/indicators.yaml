- code: public_debt_gdp
  name: Public debt to GDP
  name_es: "Deuda pública sobre el PIB"
  description: General government debt divided by the sum of nominal GDP in the latest
    four quarters.
  description_es: "Deuda pública total como porcentaje del PIB nominal acumulado en los últimos cuatro trimestres."
  onboarding:
    profiles:
      - "Empresa / consultoría"
      - "Análisis de datos"
