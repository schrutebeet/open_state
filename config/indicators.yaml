  description: Number of pupils enrolled in lower-secondary education in Spain.
  category: education
  subcategory: school_resources
  dataset: eurostat_lower_secondary_pupils
  unit: persons
  frequency: annual
  extraction:
    kind: eurostat_jsonstat
    dimension_filters:
      freq: A
      unit: NR
      worktime: TOTAL
      sector: TOT_SEC
      isced11: ED2
      sex: T
      geo: ES
- code: lower_secondary_teacher_count
  name: Lower-secondary teachers
  description: Number of classroom teachers in lower-secondary education in Spain.
  category: education
  subcategory: school_resources
  dataset: eurostat_teaching_staff
  unit: persons
  frequency: annual
  extraction:
    kind: eurostat_jsonstat
    dimension_filters:
      freq: A
      unit: NR
      isced11: ED2
      age: TOTAL
      sex: T
      geo: ES
- code: student_teacher_ratio
  name: Lower-secondary students per teacher
  description: Average number of lower-secondary pupils per classroom teacher in Spain.
  category: education
  subcategory: school_resources
  unit: students_per_teacher
  frequency: annual
  extraction:
    kind: derived
  formula: lower_secondary_pupil_count / lower_secondary_teacher_count
  dependencies:
    - lower_secondary_pupil_count
    - lower_secondary_teacher_count
