- code: energy_intensity_gdp
  name: Energy intensity of GDP
  description: Energy used to produce one thousand euros of economic output in Spain, measured in kilograms of oil equivalent at constant 2015 prices.
  category: environment
  subcategory: energy_efficiency
  dataset: eurostat_energy_intensity
  unit: kgoe_per_thousand_euros
  frequency: annual
  extraction:
    kind: eurostat_jsonstat
    dimension_filters:
      freq: A
      nrg_bal: EI_GDP_CLV15
      unit: KGOE_TEUR
      geo: ES
