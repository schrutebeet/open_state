- code: goods_trade_balance
  name: Goods trade balance
  name_es: "Saldo comercial de bienes"
  description: Goods exports minus goods imports.
  description_es: "Diferencia entre el valor de las exportaciones y las importaciones de bienes."
  onboarding:
    profiles:
      - "Empresa / consultoría"
      - "Análisis de datos"
      - "Periodismo"
      - "Investigación"
      - "Interés personal"
