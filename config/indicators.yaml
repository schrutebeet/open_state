indicators:
- code: gdp_nominal
  name: Nominal GDP
  name_es: "PIB nominal"
  description: Gross domestic product at market prices, current prices.
  description_es: "Producto interior bruto a precios de mercado, expresado a precios corrientes."
  onboarding:
    profiles:
      - "Empresa / consultoría"
      - "Análisis de datos"
      - "Periodismo"
      - "Investigación"
      - "Interés personal"
    relevant_areas:
      - "Economía"
    objectives:
      - "Investigar en profundidad"
      - "Seguir los cambios"
      - "Entender el panorama"
      - "Tomar decisiones"
  category: economy
  subcategory: national_accounts
  dataset: ine_gdp_current_prices
  unit: million_eur
  frequency: quarterly
  extraction:
    kind: ine_series
    include:
    - Producto interior bruto a precios de mercado
    exclude:
    - Variación
    - Aportación
- code: gdp_real_qoq
  name: Real GDP quarterly growth
  name_es: "Variación trimestral del PIB real"
  description: Quarter-on-quarter change in chain-linked volume GDP.
  description_es: "Cambio respecto al trimestre anterior del PIB medido en volumen encadenado."
  onboarding:
    profiles:
      - "Empresa / consultoría"
      - "Análisis de datos"
      - "Periodismo"
      - "Investigación"
      - "Interés personal"
    relevant_areas:
      - "Economía"
    objectives:
      - "Investigar en profundidad"
      - "Seguir los cambios"
      - "Entender el panorama"
      - "Tomar decisiones"
  category: economy
  subcategory: national_accounts
  dataset: ine_gdp_volume
  unit: percent
  frequency: quarterly
  extraction:
    kind: ine_series
    include:
    - Producto interior bruto a precios de mercado
    - Variación trimestral
    - Índices de volumen encadenados
    prefer:
    - Datos ajustados de estacionalidad y calendario
- code: gdp_real_yoy
  name: Real GDP annual growth
  name_es: "Variación anual del PIB real"
  description: Year-on-year change in chain-linked volume GDP.
  description_es: "Cambio respecto al mismo trimestre del año anterior del PIB medido en volumen encadenado."
