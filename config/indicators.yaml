  name_es: "Personas ocupadas de 65 a 74 años"
  description: Employed population aged 65–74 in Spain, in thousands.
  description_es: "Número de personas ocupadas de 65 a 74 años, expresado en miles."
  onboarding:
    profiles:
      - "Empresa / consultoría"
      - "Análisis de datos"
      - "Sector público"
      - "Periodismo"
      - "Investigación"
      - "Interés personal"
    relevant_areas:
      - "Empleo"
      - "Demografía"
    objectives:
      - "Investigar en profundidad"
      - "Tomar decisiones"
  category: employment
  subcategory: supporting_series
  dataset: eurostat_employment_age_counts
  unit: thousand_persons
  frequency: annual
  extraction:
    kind: eurostat_jsonstat
    dimension_filters:
      freq: A
      unit: THS_PER
      sex: T
      age: Y65-74
      citizen: TOTAL
      geo: ES
- code: employment_rate_65_74_detail
