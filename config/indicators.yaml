      - "Demografía"
    objectives:
      - "Investigar en profundidad"
      - "Seguir los cambios"
      - "Entender el panorama"
      - "Tomar decisiones"
  category: employment
  subcategory: labour_market
  dataset: ine_youth_long_term_unemployment
  unit: percent
