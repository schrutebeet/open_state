      - "Análisis de datos"
      - "Sector público"
      - "Periodismo"
      - "Investigación"
      - "Interés personal"
    relevant_areas:
      - "Empleo"
      - "Demografía"
    objectives:
      - "Investigar en profundidad"
      - "Tomar decisiones"
  category: employment
  subcategory: supporting_series
  dataset: eurostat_employment_age_rates
  unit: percent
  frequency: annual
  extraction:
    kind: eurostat_jsonstat
    dimension_filters:
      freq: A
      unit: PC
      sex: T
      age: Y65-74
      citizen: TOTAL
      geo: ES
- code: employment_rate_age_55_74
  name: Employment rate aged 55–74
  name_es: "Tasa de empleo de 55 a 74 años"
  description: Employment rate for ages 55–74, calculated from official employed-person counts and rates for ages 55–64 and 65–74.
  description_es: "Tasa calculada a partir de los recuentos y tasas oficiales de empleo de 55 a 64 y de 65 a 74 años."
  onboarding:
    profiles:
      - "Empresa / consultoría"
      - "Análisis de datos"
      - "Sector público"
      - "Periodismo"
      - "Investigación"
      - "Interés personal"
    relevant_areas:
      - "Empleo"
      - "Demografía"
    objectives:
      - "Investigar en profundidad"
      - "Tomar decisiones"
  category: employment
  subcategory: labour_market
  unit: percent
  frequency: annual
  extraction:
    kind: derived
  formula: (employment_count_55_64_detail + employment_count_65_74_detail) / (employment_count_55_64_detail / (employment_rate_over_55 / 100) + employment_count_65_74_detail / (employment_rate_65_74_detail / 100)) * 100
  dependencies:
    - employment_count_55_64_detail
    - employment_count_65_74_detail
    - employment_rate_over_55
    - employment_rate_65_74_detail
