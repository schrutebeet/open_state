- code: self_employment_rate
  name: Self-employment rate
  description: Self-employed people as a share of all employed people aged 15 to 64 in Spain.
  category: employment
  subcategory: employment_by_status
  unit: percent
  frequency: annual
  extraction:
    kind: derived
  formula: self_employed_count_total / employment_count_total * 100
  dependencies:
    - self_employed_count_total
    - employment_count_total
- code: female_self_employment_rate
  name: Women's self-employment rate
  description: Self-employed women as a share of all employed women aged 15 to 64 in Spain.
  category: employment
  subcategory: employment_by_status
  unit: percent
  frequency: annual
  extraction:
    kind: derived
  formula: self_employed_count_female / employment_count_female * 100
  dependencies:
    - self_employed_count_female
    - employment_count_female
- code: male_self_employment_rate
