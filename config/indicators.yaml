      - "Demografía"
    objectives:
      - "Investigar en profundidad"
      - "Seguir los cambios"
      - "Entender el panorama"
      - "Tomar decisiones"
  category: economy
  subcategory: merchandise_trade
  unit: percent
  frequency: monthly
  dependencies:
  - goods_exports
  - goods_imports
  formula: goods_exports / goods_imports * 100
  extraction:
    kind: derived
