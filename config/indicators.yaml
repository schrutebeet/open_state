      - "Seguir los cambios"
      - "Entender el panorama"
      - "Tomar decisiones"
  category: economy
  subcategory: merchandise_trade
  unit: eur
  frequency: monthly
  dependencies:
  - goods_exports
  - goods_imports
  formula: goods_exports - goods_imports
  extraction:
    kind: derived
- code: goods_coverage_ratio
  name: Goods trade coverage ratio
  name_es: "Cobertura de las importaciones por las exportaciones"
  description: Goods exports divided by goods imports, expressed as a percentage.
  description_es: "Porcentaje del valor de las importaciones de bienes que cubren las exportaciones."
  onboarding:
    profiles:
      - "Empresa / consultoría"
      - "Análisis de datos"
      - "Periodismo"
      - "Investigación"
      - "Interés personal"
      - "Sector público"
