[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-metrics"
version = "0.1.4"
description = "Local-first ingestion backend for official Spanish public indicators."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Civic Metrics contributors"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "filelock>=3.15,<4",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "xlrd>=2.0,<3",
  "python-calamine>=0.8.2",
  "pandas>=3.0.5",
  "openai>=1.66,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
civic-metrics = "civic_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
